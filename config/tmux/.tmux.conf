# Updated by: GPT-6 (Codex); 配置保留，仅修正编号注释。
# ---- start ----

# statusbar
set-option -g status-style 'fg=pink bg=black'
set-option -g status-right '%Y-%m-%d %H %M'
set-option -g status-right-length 50

# panes
set-option -g pane-active-border-style 'fg=blue'

# copy mode
setw -g mode-style 'bg=blue' 

# 窗口编号从 1 开始。
set -g base-index 1
# 窗格编号从 1 开始。
set -g pane-base-index 1

set -g mouse on # trigger mouse
set -g renumber-windows on # rennumber after closing any pane

set -g allow-rename off # forbidden active process change window name
set -g automatic-rename off # forbidden rename automatically
setw -g mode-keys vi # use vim mode after trigger copy mode

# 启用 UTF-8 编码
#setw -g utf8 on
#set -g status-utf8 on

# inherit current pane path
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# reload config file(need prefix)
bind r source-file ~/.tmux.conf

# escape time, 500 milliseconds by default
set-option -g escape-time 50 # set the time in milliseconds

set -g extended-keys on

# Tmux plugins manager
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugins 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g @resurrect-strategy-vim 'session'

run '~/.tmux/plugins/tpm/tpm'
# ---- end ----
