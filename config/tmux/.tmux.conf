# Updated by: GPT-6 (Codex); 配置保留，仅修正编号注释。
# ---- start ----
#set -g prefix C-z # set prefix


# 窗口编号从 1 开始。
set -g base-index 1
# 窗格编号从 1 开始。
set -g pane-base-index 1

set -g mouse on # trigger mouse
set -g renumber-windows on # rennumber after closing any pane

set -g allow-rename off # forbidden active process change window name
set -g automatic-rename off # forbidden rename automatically
setw -g mode-keys vi # use vim mode after trigger copy mode

# 启用 UTF-8 编码
#setw -g utf8 on
#set -g status-utf8 on

# inherit current pane path
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# escape time
# [reference](https://zhuanlan.zhihu.com/p/47801331)

set -g extended-keys on

# ---- end ----
